<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WheelForge LAN Overlay</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>WheelForge</strong>
      <span id="conn" class="err">offline</span>
    </div>
    <div class="status">
      <span id="hz">0 Hz</span>
      <span id="source"></span>
    </div>
    <div class="window-pick" role="group" aria-label="Chart window">
      <span>Window</span>
      <div class="window-presets" id="window-presets">
        <button type="button" class="preset" data-ms="30000">30s</button>
        <button type="button" class="preset active" data-ms="60000">1m</button>
        <button type="button" class="preset" data-ms="300000">5m</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <section class="metrics-panel">
      <div class="stats" id="stats"></div>
      <details class="stats-details" open>
        <summary>Session stats</summary>
        <div class="stats-table-wrap">
          <table class="stats-table" id="stats-table">
            <thead>
              <tr><th>Metric</th><th>Now</th><th>Avg</th><th>Min</th><th>Max</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <section class="charts-panel">
      <article class="chart-card">
        <h3>DC bus <span class="chart-range" id="range-bus"></span></h3>
        <canvas id="chart-bus"></canvas>
      </article>
      <article class="chart-card">
        <h3>Torque <span class="chart-range" id="range-torque"></span></h3>
        <canvas id="chart-torque"></canvas>
      </article>
      <article class="chart-card">
        <h3>Wheel <span class="chart-range" id="range-motion"></span></h3>
        <canvas id="chart-motion"></canvas>
      </article>
    </section>
  </main>

  <script src="overlay.js" type="module"></script>
</body>
</html>
