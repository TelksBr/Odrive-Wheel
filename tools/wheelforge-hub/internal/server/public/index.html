<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WheelForge Telemetry Hub</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0c0c0e; color: #ededf0; padding: 24px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .card { background: #131316; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 16px; max-width: 520px; }
    .ok { color: #22c55e; } .warn { color: #f59e0b; }
    a { color: #60a5fa; }
    code { background: #1a1a1f; padding: 2px 6px; border-radius: 4px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 12px 0 0; font-size: 14px; }
    dt { color: #888896; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WheelForge Telemetry Hub</h1>
    <p id="status" class="warn">Loading…</p>
    <dl id="meta"></dl>
    <p style="margin-top:16px;font-size:14px">
      <a href="/overlay/">Open LAN overlay</a> ·
      <a href="/health">/health</a>
    </p>
  </div>
  <script>
    async function refresh() {
      const res = await fetch('/health');
      const h = await res.json();
      const status = document.getElementById('status');
      status.textContent = h.ok ? `Online (${h.source})` : 'Offline — no data source';
      status.className = h.ok ? 'ok' : 'warn';
      document.getElementById('meta').innerHTML = `
        <dt>Source</dt><dd>${h.source}</dd>
        <dt>Chart Hz</dt><dd>${h.chartHz}</dd>
        <dt>Samples</dt><dd>${h.sampleCount}</dd>
        <dt>Uptime</dt><dd>${h.uptimeSec}s</dd>
        <dt>HID</dt><dd>${h.hidAvailable ? 'yes' : 'no'}</dd>
        <dt>Serial</dt><dd>${h.serialAvailable ? 'yes' : 'no'}</dd>
        <dt>LAN overlay</dt><dd><code>${location.origin}/overlay/</code></dd>
      `;
    }
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
